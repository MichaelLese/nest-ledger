name: family-finance

services:
  actual-server:
    image: actualbudget/actual-server:${ACTUAL_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACTUAL_PORT:-5006}:5006"
    volumes:
      - actual-data:/data
    networks: [application]

  # One Node/TypeScript process serves both Next.js pages and API routes.
  family-finance-web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      ACTUAL_SERVER_URL: http://actual-server:5006
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-family_finance}
      PGUSER: ${POSTGRES_USER:-family_finance}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    depends_on:
      postgres:
        condition: service_healthy
      actual-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [application, database]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_finance}
      POSTGRES_USER: ${POSTGRES_USER:-family_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [database]

networks:
  application:
  database:
    internal: true

volumes:
  actual-data:
  postgres-data:
